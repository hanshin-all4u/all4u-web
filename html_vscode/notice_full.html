<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항</title>
  <link rel="stylesheet" href="../css_vscode/notice_full.css">
  <style>
    /* ... (이전 .post-meta 스타일 동일) ... */
    .post-meta {
      text-align: left; /* 왼쪽 정렬 */
      font-size: 0.9em;
      color: #555;
      margin-bottom: 15px;
      padding: 0 10px;
    }

    /* ⭐️ 버튼 영역 스타일 추가 */
    .button-container {
      display: flex;
      justify-content: space-between; /* 목록 / 수정,삭제 분리 */
      align-items: center;
      margin-top: 20px;
    }
    
    .action-buttons {
      display: flex;
      gap: 10px;
    }

    /* ⭐️ 수정/삭제 버튼 스타일 (list-btn과 유사하게) */
    .action-btn {
      padding: 8px 16px;
      border: 1px solid #111;
      background: #fff;
      cursor: pointer;
      font-family: "Noto Sans KR", sans-serif;
      font-size: 1rem;
    }
    
    .action-btn.edit {
      /* 수정 버튼은 흰색 배경 */
    }

    .action-btn.delete {
      background: #fbe6e6; /* 삭제 버튼은 붉은 기운 */
      border-color: #dc2626;
      color: #dc2626;
    }
    .action-btn.delete:hover {
      background: #dc2626;
      color: #fff;
    }

    /* ⭐️ 삭제 확인 모달 스타일 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden; /* 기본 숨김 */
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .modal-content {
      background: #fff;
      border-radius: 15px;
      border: 3px solid #ffd400; /* 테마 색상 적용 */
      padding: 24px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.2s ease;
    }
    .modal-overlay.visible {
      visibility: visible;
      opacity: 1;
    }
    .modal-overlay.visible .modal-content {
      transform: scale(1);
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- 상단 (수정 없음) -->
    <header class="top-bar">...</header>

    <!-- 본문 -->
    <main class="content">
      <h1>공지사항</h1>
      
      <section class="review-box">
        
        <h2 id="post-title" style="margin-bottom: 10px;">
          불러오는 중...
        </h2>
        
        <div class="post-meta">
            <span id="post-author"></span>
            <span style="margin: 0 8px;">|</span>
            <span id="post-created-at"></span>
        </div>

        <div id="post-content" class="review-body">
          <!-- 스크립트가 여기를 채웁니다. -->
        </div>
      </section>

      <!-- ⭐️⭐️⭐️ 버튼 컨테이너로 수정 ⭐️⭐️⭐️ -->
      <div class="button-container">
        <!-- 목록 버튼 -->
        <button class="list-btn" style="margin: 0;" onclick="window.location.href='notice.html'">
          목록
        </button>
        
        <!-- 수정/삭제 버튼 (관리자용) -->
        <!-- ⭐️ 이 버튼들은 실제로는 관리자일 때만 보여야 합니다. -->
        <div class="action-buttons">
          <button id="edit-btn" class="action-btn edit">수정</button>
          <button id="delete-btn" class="action-btn delete">삭제</button>
        </div>
      </div>
      <!-- ⭐️⭐️⭐️ 여기까지 ⭐️⭐️⭐️ -->

      <!-- 하단 검색 (수정 없음) -->
      <div class="search-bar">...</div>
    </main>

  </div>

  <!-- ⭐️⭐️⭐️ 삭제 확인 모달 추가 ⭐️⭐️⭐️ -->
  <div id="delete-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem;">
        정말 삭제하시겠습니까?
      </h3>
      <p style="margin-bottom: 1.5rem; color: #555;">
        삭제된 데이터는 복구할 수 없습니다.
      </p>
      <div style="display: flex; justify-content: center; gap: 15px;">
        <button id="cancel-delete" class="action-btn" style="flex: 1;">
          취소
        </button>
        <button id="confirm-delete" class="action-btn delete" style="flex: 1;">
          삭제
        </button>
      </div>
    </div>
  </div>

  <!-- ⭐️⭐️⭐️ 스크립트 대폭 수정 ⭐️⭐️⭐️ -->
  <script>
    let currentPostId = null; // 현재 글 ID (삭제/수정 시 사용)

    // 1. 페이지 로드 시 실행되는 함수
    window.onload = async function() {
        const titleElement = document.getElementById('post-title');
        const contentElement = document.getElementById('post-content');
        const authorElement = document.getElementById('post-author');
        const createdAtElement = document.getElementById('post-created-at');

        try {
            const urlParams = new URLSearchParams(window.location.search);
            currentPostId = urlParams.get('id'); // ⭐️ ID를 전역 변수에 저장

            if (!currentPostId) {
                throw new Error('게시글 ID가 없습니다.');
            }

            const API_ENDPOINT = `/api/notices/${currentPostId}`; // (API 9.2)
            const response = await fetch(API_ENDPOINT);

            if (response.ok) { 
                const post = await response.json(); 
                titleElement.innerText = post.title;
                authorElement.innerText = `작성자: ${post.authorNickname}`;
                createdAtElement.innerText = `작성일: ${post.createdAt.split('T')[0]}`;
                contentElement.innerHTML = post.content.replace(/\n/g, '<br>');

            } else {
                const errorData = await response.json();
                throw new Error(errorData.message || '게시글을 불러오지 못했습니다.');
            }

        } catch (error) {
            console.error('Error:', error);
            titleElement.innerText = '오류';
            contentElement.innerHTML = 
                `<p style="text-align: left;">${error.message}</p>` +
                '<p style="text-align: left; margin-top: 1rem;"><a href="notice.html" style="color: blue; text-decoration: underline;">목록으로 돌아가기</a></p>';
            
            // 오류 시 수정/삭제 버튼 숨김
            document.querySelector('.action-buttons').style.display = 'none';
        }
    };

    // 2. 수정 버튼 클릭 (API 9.4를 위해 notice_write.html로 이동)
    document.getElementById('edit-btn').addEventListener('click', () => {
        if (currentPostId) {
            // 'id'를 가지고 글쓰기/수정 페이지로 이동
            window.location.href = `notice_write.html?id=${currentPostId}`;
        }
    });

    // 3. 삭제 버튼 및 모달 관련 (API 9.5)
    const deleteModal = document.getElementById('delete-modal');
    const deleteBtn = document.getElementById('delete-btn');
    const cancelDeleteBtn = document.getElementById('cancel-delete');
    const confirmDeleteBtn = document.getElementById('confirm-delete');

    // '삭제' 버튼 클릭 -> 모달 열기
    deleteBtn.addEventListener('click', () => {
        deleteModal.classList.add('visible');
    });

    // '취소' 버튼 클릭 -> 모달 닫기
    cancelDeleteBtn.addEventListener('click', () => {
        deleteModal.classList.remove('visible');
    });

    // '모달 외부' 클릭 -> 모달 닫기
    deleteModal.addEventListener('click', (e) => {
        if (e.target === deleteModal) {
            deleteModal.classList.remove('visible');
        }
    });

    // '모달의 삭제 버튼' 클릭 -> 실제 삭제 로직 실행
    confirmDeleteBtn.addEventListener('click', async () => {
        try {
            const API_ENDPOINT = `/api/notices/${currentPostId}`; // (API 9.5)
            // ⭐️ 인증 토큰 (⭐️ 실제 토큰 키로 변경하세요)
            const authToken = 'Bearer ' + localStorage.getItem('accessToken');

            const response = await fetch(API_ENDPOINT, {
                method: 'DELETE',
                headers: {
                    'Authorization': authToken // ⭐️ 9.5 인증 필요
                }
            });

            if (response.status === 204) { // 204 No Content (삭제 성공)
                alert('공지사항이 삭제되었습니다.'); // ⭐️ 임시로 alert 사용
                window.location.href = 'notice.html'; // 목록 페이지로 이동

            } else {
                // (e.g., 403 Forbidden, 404 Not Found)
                const errorData = await response.json();
                let errorMessage = errorData.message || '삭제에 실패했습니다.';
                if (response.status === 403) {
                    errorMessage = '삭제 권한이 없습니다. (관리자만 가능)';
                }
                alert(errorMessage); // ⭐️ 임시로 alert 사용
            }

        } catch (error) {
            console.error('Error:', error);
            alert('네트워크 오류가 발생했습니다.'); // ⭐️ 임시로 alert 사용
        } finally {
            deleteModal.classList.remove('visible'); // 모달 닫기
        }
    });
    
    // (참고: alert()는 실제 서비스에서는 showTempMessage 같은 커스텀 함수로
    //  대체하는 것이 좋습니다. 여기서는 모달 로직과 분리하기 위해 임시로 사용했습니다.)

  </script>
</body>
</html>
