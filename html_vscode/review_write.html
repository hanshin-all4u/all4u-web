<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>후기 글쓰기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="review_write.css">
</head>
<body class="bg-white p-4 md:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border-4 border-yellow-400">
        <div class="p-6 md:p-10">
            <!-- 폼 시작 -->
            <form id="notice-form">
                <!-- ⭐️ 제목이 모드에 따라 바뀜 -->
                <h2 id="form-title" class="text-2xl font-bold text-gray-800 mb-6">
                    후기 글쓰기
                </h2>

                <!-- 제목 -->
                <div class="mb-6">
                    <label for="title" class="block text-lg font-semibold text-gray-700 mb-2">제목</label>
                    <input 
                        type="text" 
                        id="title" 
                        name="title" 
                        placeholder="제목을 입력하세요..." 
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm transition duration-150 ease-in-out focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/50"
                    >
                </div>
                
                <!-- 내용 -->
                <div class="mb-8">
                    <label for="content" class="block text-lg font-semibold text-gray-700 mb-2">내용</label>
                    <textarea 
                        id="content" 
                        name="content" 
                        rows="12"
                        placeholder="내용을 입력하세요..." 
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm transition duration-150 ease-in-out focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/50"
                    ></textarea>
                </div>
                
                <!-- 버튼 섹션 -->
                <div class="flex justify-end gap-4">
                    <!-- 취소 버튼 (목록 페이지로 이동) -->
                    <button 
                        type="button" 
                        onclick="window.location.href='notice.html'"
                        class="px-6 py-2 bg-gray-200 text-gray-700 font-bold rounded-lg border-2 border-gray-300 transition duration-200 hover:bg-gray-300"
                    >
                        취소
                    </button>
                    <!-- ⭐️ 버튼 텍스트가 모드에 따라 바뀜 -->
                    <button 
                        type="submit" 
                        id="submit-button"
                        class="px-6 py-2 bg-yellow-400 text-black font-bold rounded-lg border-2 border-black transition duration-200 hover:bg-yellow-500 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-yellow-500/50"
                    >
                        등록하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ⭐️ API 엔드포인트 (후기용)
        const REVIEW_API_BASE = 'http://localhost:8080/api/reviews';
        const LICENSE_API_BASE = 'http://localhost:8080/api/licenses';
        
        // ⭐️ 페이지 이동 (후기용)
        const REVIEW_LIST_PAGE = 'review.html'; // 후기 목록
        const REVIEW_DETAIL_PAGE = 'myreview.html'; // 후기 상세
    
        let isEditMode = false;
        let currentReviewId = null; // 수정할 후기 ID (reviewId)
        let currentLicenseId = null; // 작성할 자격증 ID (jmcd)
    
        // 1. 페이지 로드 시 실행되는 함수
        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentReviewId = urlParams.get('reviewId');
            currentLicenseId = urlParams.get('jmcd');
            
            const formTitle = document.getElementById('form-title');
            const submitButton = document.getElementById('submit-button');
    
            if (currentReviewId) {
                // --- 📌 수정 모드 (URL에 reviewId=...가 있을 때) ---
                isEditMode = true;
                formTitle.innerText = '후기 수정하기';
                submitButton.innerText = '수정하기';
    
                // API 4.3 (GET /api/reviews/{reviewId})로 기존 후기 내용 불러오기
                try {
                    const response = await fetch(`${REVIEW_API_BASE}/${currentReviewId}`, {
                        headers: getAuthHeader()
                    });
                    if (!response.ok) {
                        if(response.status === 403) throw new Error('이 후기를 수정할 권한이 없습니다.');
                        throw new Error('후기를 불러올 수 없습니다.');
                    }
                    
                    const review = await response.json(); // ReviewResponseDto
                    
                    // 폼에 기존 내용 채워넣기
                    document.getElementById('title').value = review.title; // (가정)
                    document.getElementById('content').value = review.comment; // (가정)
                    
                } catch (error) {
                    console.error('Error fetching review:', error);
                    showTempMessage(error.message, 'error');
                    submitButton.disabled = true; // 로드 실패 시 제출 비활성화
                }
    
            } else if (currentLicenseId) {
                // --- 📌 새 글 작성 모드 (URL에 jmcd=...가 있을 때) ---
                isEditMode = false;
                formTitle.innerText = '후기 글쓰기';
                submitButton.innerText = '등록하기';
                // (jmcd는 있으나 reviewId가 없으면 새 글 모드)
            
            } else {
                // --- 📌 오류 (jmcd도, reviewId도 없을 때) ---
                alert('잘못된 접근입니다. 자격증 ID(jmcd) 또는 후기 ID(reviewId)가 필요합니다.');
                window.location.href = REVIEW_LIST_PAGE;
            }
    
            // 취소 버튼 클릭 시 후기 목록 페이지로 이동
            const cancelButton = document.querySelector('button[onclick*="notice.html"]');
            if(cancelButton) {
                cancelButton.onclick = () => window.location.href = REVIEW_LIST_PAGE;
            }
        };
    
        // 2. 폼 제출 시 실행되는 함수
        document.getElementById('notice-form').addEventListener('submit', async function(e) {
            e.preventDefault(); 
    
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            
            // ⭐️ API 4.2와 4.4는 Request Body 형식이 다릅니다. (가정)
            // 4.2 (POST): { "difficulty": "EASY", "comment": "..." }
            // 4.4 (PATCH): { "difficulty": "EASY", "comment": "..." }
            // (API 명세에 title이 없지만, HTML 폼에는 있으므로 일단 포함시킴)
            const postData = { 
                title: title, // (가정)
                comment: content, 
                difficulty: 'NORMAL' // (임시) 난이도 선택 UI가 없으므로 'NORMAL'로 고정
            };
    
            let API_ENDPOINT = '';
            let httpMethod = '';
            let successStatus = 200;
            let successMessage = '';
    
            if (isEditMode) {
                // "수정 모드" (API 4.4)
                API_ENDPOINT = `${REVIEW_API_BASE}/${currentReviewId}`;
                httpMethod = 'PATCH';
                successStatus = 200; // 4.4 응답은 200 OK
                successMessage = '후기가 성공적으로 수정되었습니다.';
            } else {
                // "새 글 작성 모드" (API 4.2)
                API_ENDPOINT = `${LICENSE_API_BASE}/${currentLicenseId}/reviews`;
                httpMethod = 'POST';
                successStatus = 201; // 4.2 응답은 201 Created
                successMessage = '후기가 성공적으로 등록되었습니다.';
            }
    
            try {
                // 3. fetch를 사용해 서버에 요청
                const response = await fetch(API_ENDPOINT, {
                    method: httpMethod,
                    headers: {
                        ...getAuthHeader(),
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(postData) 
                });
    
                if (response.status === successStatus) {
                    const data = await response.json(); // ReviewResponseDto
                    showTempMessage(successMessage, 'success');
                    
                    // 1.5초 후, 방금 작성/수정한 '후기 상세 페이지'로 이동
                    setTimeout(() => {
                        // ⭐️ 이동할 페이지와 ID 파라미터명 변경
                        window.location.href = `${REVIEW_DETAIL_PAGE}?reviewId=${data.id}`;
                    }, 1500);
    
                } else {
                    const errorData = await response.json();
                    let errorMessage = errorData.message || '요청에 실패했습니다.';
                    if (response.status === 403) {
                        errorMessage = '작업을 수행할 권한이 없습니다.';
                    }
                    showTempMessage(errorMessage, 'error');
                }
    
            } catch (error) {
                console.error('Error:', error);
                showTempMessage('네트워크 오류가 발생했습니다.', 'error');
            }
        });
    
        // 4. (Helper) 인증 헤더 가져오기
        function getAuthHeader() {
            const authToken = localStorage.getItem('accessToken');
            if (!authToken) {
                alert('로그인이 필요합니다.');
                // (로그인 페이지로 리다이렉트)
                return {};
            }
            return { 'Authorization': 'Bearer ' + authToken };
        }
    
        // 5. (Helper) 임시 메시지 박스 함수 (동일)
        function showTempMessage(message, type = 'success') {
            // ... (제공해주신 코드와 동일) ...
        }
    </script>
</body>
</html>
