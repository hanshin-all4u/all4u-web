<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 글쓰기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="notice_write.css">
</head>
<body class="bg-white p-4 md:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border-4 border-yellow-400">
        <div class="p-6 md:p-10">
            <!-- 폼 시작 -->
            <form id="notice-form">
                <!-- ⭐️ 제목이 모드에 따라 바뀜 -->
                <h2 id="form-title" class="text-2xl font-bold text-gray-800 mb-6">
                    공지사항 글쓰기
                </h2>

                <!-- 제목 -->
                <div class="mb-6">
                    <label for="title" class="block text-lg font-semibold text-gray-700 mb-2">제목</label>
                    <input 
                        type="text" 
                        id="title" 
                        name="title" 
                        placeholder="제목을 입력하세요..." 
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm transition duration-150 ease-in-out focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/50"
                    >
                </div>
                
                <!-- 내용 -->
                <div class="mb-8">
                    <label for="content" class="block text-lg font-semibold text-gray-700 mb-2">내용</label>
                    <textarea 
                        id="content" 
                        name="content" 
                        rows="12"
                        placeholder="내용을 입력하세요..." 
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm transition duration-150 ease-in-out focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/50"
                    ></textarea>
                </div>
                
                <!-- 버튼 섹션 -->
                <div class="flex justify-end gap-4">
                    <!-- 취소 버튼 (목록 페이지로 이동) -->
                    <button 
                        type="button" 
                        onclick="window.location.href='notice.html'"
                        class="px-6 py-2 bg-gray-200 text-gray-700 font-bold rounded-lg border-2 border-gray-300 transition duration-200 hover:bg-gray-300"
                    >
                        취소
                    </button>
                    <!-- ⭐️ 버튼 텍스트가 모드에 따라 바뀜 -->
                    <button 
                        type="submit" 
                        id="submit-button"
                        class="px-6 py-2 bg-yellow-400 text-black font-bold rounded-lg border-2 border-black transition duration-200 hover:bg-yellow-500 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-yellow-500/50"
                    >
                        등록하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ⭐️ 스크립트 대폭 수정 ⭐️
        
        let isEditMode = false; // 현재 수정 모드인지 확인
        let currentPostId = null; // 수정 중인 글의 ID

        // 1. 페이지 로드 시 실행되는 함수
        window.onload = async () => {
            // URL에서 'id' 파라미터를 찾습니다. (예: ?id=123)
            const urlParams = new URLSearchParams(window.location.search);
            currentPostId = urlParams.get('id');

            if (currentPostId) {
                // ID가 있으면 "수정 모드"
                isEditMode = true;
                document.getElementById('form-title').innerText = '공지사항 수정하기';
                document.getElementById('submit-button').innerText = '수정하기';

                // API 9.2 (GET)를 사용해 기존 글 내용을 불러옵니다.
                try {
                    const response = await fetch(`/api/notices/${currentPostId}`);
                    if (!response.ok) throw new Error('게시글을 불러올 수 없습니다.');
                    
                    const post = await response.json();
                    
                    // 폼에 기존 내용을 채워넣습니다.
                    document.getElementById('title').value = post.title;
                    document.getElementById('content').value = post.content;
                    
                } catch (error) {
                    console.error('Error fetching post:', error);
                    showTempMessage(error.message, 'error');
                }
            }
            // ID가 없으면 "새 글쓰기 모드" (아무것도 안 함)
        };

        // 2. 폼 제출 시 실행되는 함수
        document.getElementById('notice-form').addEventListener('submit', async function(e) {
            e.preventDefault(); 

            // 폼 데이터 가져오기
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const postData = { title, content };

            let API_ENDPOINT = '/api/notices'; // 기본 API 주소 (생성용)
            let httpMethod = 'POST'; // 기본 HTTP 메소드 (생성용)
            let successStatus = 201; // 생성 성공 상태
            let successMessage = '공지사항이 성공적으로 등록되었습니다.';

            // ⭐️ 인증 토큰 (⭐️ 실제 토큰 키로 변경하세요)
            const authToken = 'Bearer ' + localStorage.getItem('accessToken');

            if (isEditMode) {
                // "수정 모드"일 경우 API 주소와 메소드 변경
                API_ENDPOINT = `/api/notices/${currentPostId}`; // (API 9.4)
                httpMethod = 'PATCH'; // (API 9.4)
                successStatus = 200; // 수정 성공 상태
                successMessage = '공지사항이 성공적으로 수정되었습니다.';
            }

            try {
                // 3. fetch를 사용해 서버에 요청 (POST 또는 PATCH)
                const response = await fetch(API_ENDPOINT, {
                    method: httpMethod,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': authToken // ⭐️ 9.3, 9.4 모두 인증 필요
                    },
                    body: JSON.stringify(postData) 
                });

                if (response.status === successStatus) { // 성공 (201 또는 200)
                    const data = await response.json(); 
                    showTempMessage(successMessage, 'success');
                    
                    // 1.5초 후, 상세 페이지로 이동 (id는 새로 생성됐거나 수정 중인 id)
                    setTimeout(() => {
                        window.location.href = `notice_full.html?id=${data.id}`;
                    }, 1500);

                } else {
                    // 서버가 오류 응답
                    const errorData = await response.json();
                    let errorMessage = errorData.message || '요청에 실패했습니다.';
                    if (response.status === 403) {
                        errorMessage = '작업을 수행할 권한이 없습니다. (관리자만 가능)';
                    }
                    showTempMessage(errorMessage, 'error');
                }

            } catch (error) {
                console.error('Error:', error);
                showTempMessage('네트워크 오류가 발생했습니다.', 'error');
            }
        });

        // 3. 임시 메시지 박스 함수 (동일)
        function showTempMessage(message, type = 'success') {
            const box = document.createElement('div');
            box.id = 'temp-message-box';
            const bgColor = type === 'success' ? 'bg-green-600' : 'bg-red-600';
            box.className = `fixed top-5 left-1/2 -translate-x-1/2 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg transition-all duration-300 ease-in-out opacity-0 translate-y-[-20px]`;
            box.textContent = message;
            document.body.appendChild(box);
            setTimeout(() => {
                box.classList.remove('opacity-0', 'translate-y-[-20px]');
                box.classList.add('opacity-100', 'translate-y-0');
            }, 10);
            setTimeout(() => {
                box.classList.remove('opacity-100', 'translate-y-0');
                box.classList.add('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => box.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
