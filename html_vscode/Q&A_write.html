<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A 글쓰기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="Q&A_write.css">
</head>
<body class="bg-white p-4 md:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border-4 border-yellow-400">
        <div class="p-6 md:p-10">
            <!-- 폼 시작 -->
            <form id="notice-form">
                <!-- ⭐️ 제목이 모드에 따라 바뀜 -->
                <h2 id="form-title" class="text-2xl font-bold text-gray-800 mb-6">
                    Q&A 글쓰기
                </h2>

                <!-- 제목 -->
                <div class="mb-6">
                    <label for="title" class="block text-lg font-semibold text-gray-700 mb-2">제목</label>
                    <input 
                        type="text" 
                        id="title" 
                        name="title" 
                        placeholder="제목을 입력하세요..." 
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm transition duration-150 ease-in-out focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/50"
                    >
                </div>
                
                <!-- 내용 -->
                <div class="mb-8">
                    <label for="content" class="block text-lg font-semibold text-gray-700 mb-2">내용</label>
                    <textarea 
                        id="content" 
                        name="content" 
                        rows="12"
                        placeholder="내용을 입력하세요..." 
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm transition duration-150 ease-in-out focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/50"
                    ></textarea>
                </div>
                
                <!-- 버튼 섹션 -->
                <div class="flex justify-end gap-4">
                    <!-- 취소 버튼 (목록 페이지로 이동) -->
                    <button 
                        type="button" 
                        onclick="window.location.href='notice.html'"
                        class="px-6 py-2 bg-gray-200 text-gray-700 font-bold rounded-lg border-2 border-gray-300 transition duration-200 hover:bg-gray-300"
                    >
                        취소
                    </button>
                    <!-- ⭐️ 버튼 텍스트가 모드에 따라 바뀜 -->
                    <button 
                        type="submit" 
                        id="submit-button"
                        class="px-6 py-2 bg-yellow-400 text-black font-bold rounded-lg border-2 border-black transition duration-200 hover:bg-yellow-500 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-yellow-500/50"
                    >
                        등록하기
                    </button>
                </div>
            </form>
        </div>
    </div>

<!-- 📌 [수정] Q&A API에 맞게 스크립트 수정 -->
<script>
    // ⭐️ API 엔드포인트 (Q&A용)
    const API_ENDPOINT = 'http://localhost:8080/api/qna'; // API 6.1 (POST)
    
    // ⭐️ 페이지 이동 (Q&A용)
    const QNA_LIST_PAGE = 'Q&A.html';     // Q&A 목록
    const QNA_DETAIL_PAGE = 'Q&A_my.html'; // Q&A 상세 (업로드하신 파일명)

    // 1. 페이지 로드 시 (수정 모드 없음)
    window.onload = () => {
        // "수정하기" 로직이 없으므로, onload에서 기존 데이터를 불러올 필요가 없습니다.
        
        // 취소 버튼의 링크만 Q&A 목록으로 설정
        const cancelButton = document.querySelector('button[onclick*="notice.html"]');
        if(cancelButton) {
            cancelButton.onclick = () => window.location.href = QNA_LIST_PAGE;
        }
    };

    // 2. 폼 제출 시 실행되는 함수
    document.getElementById('qna-form').addEventListener('submit', async function(e) {
        e.preventDefault(); 

        // 폼 데이터 가져오기
        const title = document.getElementById('title').value;
        const content = document.getElementById('content').value;
        const secret = document.getElementById('secret').checked; // 📌 비밀글 여부
        
        // ⭐️ API 6.1 Request Body
        const postData = { 
            title: title, 
            content: content, 
            secret: secret 
        };

        const httpMethod = 'POST';
        const successStatus = 201; // 6.1 응답은 201 Created
        const successMessage = '문의가 성공적으로 등록되었습니다.';

        try {
            // 3. fetch를 사용해 서버에 요청 (API 6.1)
            const response = await fetch(API_ENDPOINT, {
                method: httpMethod,
                headers: {
                    ...getAuthHeader(), // (Helper) 인증 헤더
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(postData) 
            });

            if (response.status === successStatus) { // 성공 (201)
                const data = await response.json(); // QnaResponseDto
                showTempMessage(successMessage, 'success');
                
                // 1.5초 후, 방금 작성한 'Q&A 상세 페이지'로 이동
                setTimeout(() => {
                    window.location.href = `${QNA_DETAIL_PAGE}?qnaId=${data.id}`;
                }, 1500);

            } else {
                // 서버가 오류 응답
                const errorData = await response.json();
                let errorMessage = errorData.message || '요청에 실패했습니다.';
                if (response.status === 403) {
                    errorMessage = '작업을 수행할 권한이 없습니다.';
                } else if (response.status === 401) {
                    errorMessage = '로그인이 필요합니다.';
                }
                showTempMessage(errorMessage, 'error');
            }

        } catch (error) {
            console.error('Error:', error);
            showTempMessage('네트워크 오류가 발생했습니다.', 'error');
        }
    });

    // 3. (Helper) 인증 헤더 가져오기
    function getAuthHeader() {
        const authToken = localStorage.getItem('accessToken');
        if (!authToken) {
            alert('로그인이 필요합니다.');
            // (로그인 페이지로 리다이렉트)
            return {};
        }
        return { 'Authorization': 'Bearer ' + authToken };
    }

    // 4. (Helper) 임시 메시지 박스 함수
    function showTempMessage(message, type = 'success') {
        const box = document.createElement('div');
        box.id = 'temp-message-box';
        const bgColor = type === 'success' ? 'bg-green-600' : 'bg-red-600';
        box.className = `fixed top-5 left-1/2 -translate-x-1/2 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg transition-all duration-300 ease-in-out opacity-0 translate-y-[-20px]`;
        box.textContent = message;
        document.body.appendChild(box);
        setTimeout(() => {
            box.classList.remove('opacity-0', 'translate-y-[-20px]');
            box.classList.add('opacity-100', 'translate-y-0');
        }, 10);
        setTimeout(() => {
            box.classList.remove('opacity-100', 'translate-y-0');
            box.classList.add('opacity-0', 'translate-y-[-20px]');
            setTimeout(() => box.remove(), 300);
        }, 3000);
    }
</script>
</body>
</html>
